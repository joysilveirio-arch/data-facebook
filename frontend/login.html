<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#0b1220">
    <title>Login | Facebook Analytics</title>

    <style>
        :root {
            --bg: #0b1220;
            --card: rgba(17, 27, 46, 0.96);
            --border: #2b3a52;
            --text: #f8fafc;
            --muted: #9caec5;
            --primary: #3978f6;
            --primary-hover: #2563eb;
            --success: #4ade80;
            --danger: #fca5a5;
            --input-bg: #0b1425;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: grid;
            place-items: center;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(37, 99, 235, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(14, 165, 233, 0.12),
                    transparent 32%
                ),
                var(--bg);
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 30px;
        }

        .brand-icon {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #3978f6, #1554c0);
            font-size: 23px;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
        }

        .brand-name {
            margin: 0;
            font-size: 16px;
            font-weight: 750;
            letter-spacing: 0.2px;
        }

        .brand-caption {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #77a6ff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(27px, 5vw, 33px);
            letter-spacing: -0.8px;
        }

        .description {
            margin: 12px 0 26px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 650;
        }

        .input-wrap {
            position: relative;
        }

        input {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 13px 14px;
            border: 1px solid #35445d;
            border-radius: 10px;
            outline: none;
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(57, 120, 246, 0.16);
        }

        input:disabled,
        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .password-input {
            padding-right: 82px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 9px;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 7px 8px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #93b7ff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .password-toggle:hover {
            color: #ffffff;
            background: rgba(59, 130, 246, 0.12);
        }

        .password-toggle:focus-visible,
        button:focus-visible {
            outline: 2px solid #93b7ff;
            outline-offset: 3px;
        }

        .primary-button,
        .secondary-button {
            width: 100%;
            min-height: 48px;
            margin-top: 8px;
            padding: 13px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 750;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .primary-button {
            border: 1px solid var(--primary);
            background: var(--primary);
            color: #ffffff;
        }

        .primary-button:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .secondary-button {
            margin-top: 12px;
            border: 1px solid #35445d;
            background: transparent;
            color: #dbeafe;
        }

        .secondary-button:hover:not(:disabled) {
            background: rgba(148, 163, 184, 0.08);
        }

        .message {
            display: none;
            margin: 18px 0 0;
            padding: 12px 13px;
            border: 1px solid transparent;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .message.visible {
            display: block;
        }

        .message.error {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.25);
            background: rgba(127, 29, 29, 0.18);
        }

        .message.success {
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.25);
            background: rgba(20, 83, 45, 0.18);
        }

        .footer {
            margin: 25px 0 0;
            padding-top: 18px;
            border-top: 1px solid rgba(148, 163, 184, 0.15);
            color: #8293aa;
            text-align: center;
            font-size: 11px;
            line-height: 1.7;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .login-card {
                padding: 25px 21px;
                border-radius: 17px;
            }

            .brand {
                margin-bottom: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">
            <div class="brand-icon" aria-hidden="true">F</div>
            <div>
                <p class="brand-name">Facebook Analytics</p>
                <p class="brand-caption">Social Media Intelligence Platform</p>
            </div>
        </div>

        <p class="eyebrow">Secure Access</p>
        <h1 id="title">Welcome back</h1>
        <p class="description" id="description">
            Sign in to access your social media analytics dashboard,
            sentiment analysis, and machine learning tools.
        </p>

        <form id="authForm" autocomplete="on">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your username or email"
                    autocomplete="username"
                    minlength="3"
                    maxlength="120"
                    required
                >
            </div>

            <div class="form-group" id="emailField" hidden>
                <label for="email">Email Address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    maxlength="254"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrap">
                    <input
                        id="password"
                        class="password-input"
                        name="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        minlength="1"
                        maxlength="128"
                        required
                    >

                    <button
                        id="togglePassword"
                        class="password-toggle"
                        type="button"
                        aria-controls="password"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button
                id="submitButton"
                class="primary-button"
                type="submit"
            >
                Sign In
            </button>

            <button
                id="toggleButton"
                class="secondary-button"
                type="button"
            >
                Create New Account
            </button>
        </form>

        <p
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        ></p>

        <p class="footer">
            Facebook Social Media Analytics, Machine Learning
            &amp; Sentiment Analysis Platform
        </p>
    </main>

    <script>
        "use strict";

        (() => {
            const form = document.getElementById("authForm");
            const message = document.getElementById("message");
            const title = document.getElementById("title");
            const description = document.getElementById("description");

            const usernameInput = document.getElementById("username");
            const emailField = document.getElementById("emailField");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");

            const togglePasswordButton =
                document.getElementById("togglePassword");
            const submitButton = document.getElementById("submitButton");
            const toggleButton = document.getElementById("toggleButton");

            let registering = false;
            let submitting = false;

            // Show/hide password while typing.
            togglePasswordButton.addEventListener("click", () => {
                const showPassword = passwordInput.type === "password";

                passwordInput.type = showPassword ? "text" : "password";
                togglePasswordButton.textContent =
                    showPassword ? "Hide" : "Show";

                togglePasswordButton.setAttribute(
                    "aria-label",
                    showPassword ? "Hide password" : "Show password"
                );

                togglePasswordButton.setAttribute(
                    "aria-pressed",
                    String(showPassword)
                );

                passwordInput.focus();
            });

            // Switch between login and registration.
            toggleButton.addEventListener("click", () => {
                registering = !registering;

                title.textContent = registering
                    ? "Create your account"
                    : "Welcome back";

                description.textContent = registering
                    ? "Create an account to access the Facebook Analytics platform."
                    : "Sign in to access your social media analytics dashboard, sentiment analysis, and machine learning tools.";

                submitButton.textContent = registering
                    ? "Create Account"
                    : "Sign In";

                toggleButton.textContent = registering
                    ? "Back to Sign In"
                    : "Create New Account";

                emailField.hidden = !registering;
                emailInput.required = registering;

                passwordInput.autocomplete = registering
                    ? "new-password"
                    : "current-password";

                passwordInput.minLength = registering ? 8 : 1;

                clearMessage();
            });

            function showMessage(text, type = "error") {
                message.textContent = text;
                message.className = `message visible ${type}`;
            }

            function clearMessage() {
                message.textContent = "";
                message.className = "message";
            }

            async function readResponse(response) {
                const contentType =
                    response.headers.get("content-type") || "";

                if (contentType.includes("application/json")) {
                    return await response.json();
                }

                return {};
            }

            function getErrorMessage(result, response) {
                const detail = result?.detail;

                if (typeof detail === "string" && detail.trim()) {
                    return detail;
                }

                if (Array.isArray(detail)) {
                    return detail
                        .map(item => item.msg || "Invalid input")
                        .join(". ");
                }

                if (typeof result?.message === "string") {
                    return result.message;
                }

                if (response.status === 401) {
                    return "Username/email or password is incorrect.";
                }

                if (response.status === 409) {
                    return "This username or email is already registered.";
                }

                if (response.status >= 500) {
                    return "A server error occurred. Please try again later.";
                }

                return "The request could not be completed. Please check your input.";
            }

            function getSafeReturnUrl() {
                const params = new URLSearchParams(window.location.search);
                const next = params.get("next");

                // Only allow paths on this same site.
                if (
                    next &&
                    next.startsWith("/") &&
                    !next.startsWith("//") &&
                    !next.includes("\\")
                ) {
                    return next;
                }

                return "/";
            }

            form.addEventListener("submit", async event => {
                event.preventDefault();

                if (submitting) {
                    return;
                }

                clearMessage();

                if (!form.reportValidity()) {
                    return;
                }

                const username = usernameInput.value.trim();
                const password = passwordInput.value;
                const email = emailInput.value.trim();

                if (username.length < 3) {
                    showMessage("Username must contain at least 3 characters.");
                    usernameInput.focus();
                    return;
                }

                if (registering && password.length < 8) {
                    showMessage("Password must contain at least 8 characters.");
                    passwordInput.focus();
                    return;
                }

                if (registering && !email) {
                    showMessage("Please enter your email address.");
                    emailInput.focus();
                    return;
                }

                const payload = registering
                    ? { username, email, password }
                    : { username, password };

                const endpoint = registering
                    ? "/api/v1/auth/register"
                    : "/api/v1/auth/login";

                submitting = true;
                submitButton.disabled = true;
                toggleButton.disabled = true;
                togglePasswordButton.disabled = true;

                usernameInput.disabled = true;
                emailInput.disabled = true;
                passwordInput.disabled = true;

                submitButton.textContent = registering
                    ? "Creating account..."
                    : "Signing in...";

                showMessage("Please wait...", "success");

                try {
                    const response = await fetch(endpoint, {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify(payload),
                        cache: "no-store"
                    });

                    const result = await readResponse(response);

                    if (!response.ok) {
                        throw new Error(getErrorMessage(result, response));
                    }

                    if (registering) {
                        registering = false;

                        title.textContent = "Welcome back";
                        description.textContent =
                            "Your account has been created. Sign in to continue.";

                        submitButton.textContent = "Sign In";
                        toggleButton.textContent = "Create New Account";

                        emailField.hidden = true;
                        emailInput.required = false;
                        emailInput.value = "";

                        passwordInput.value = "";
                        passwordInput.type = "password";
                        passwordInput.autocomplete = "current-password";
                        passwordInput.minLength = 1;

                        togglePasswordButton.textContent = "Show";
                        togglePasswordButton.setAttribute(
                            "aria-label",
                            "Show password"
                        );
                        togglePasswordButton.setAttribute(
                            "aria-pressed",
                            "false"
                        );

                        usernameInput.focus();

                        showMessage(
                            "Account created successfully. You can now sign in.",
                            "success"
                        );

                    } else {
                        // Login endpoint must set the session cookie.
                        window.location.replace(getSafeReturnUrl());
                    }

                } catch (error) {
                    console.error("Authentication error:", error);

                    showMessage(
                        error instanceof TypeError
                            ? "Unable to connect to the server. Check that the backend is running."
                            : error.message
                    );

                } finally {
                    submitting = false;

                    submitButton.disabled = false;
                    toggleButton.disabled = false;
                    togglePasswordButton.disabled = false;

                    usernameInput.disabled = false;
                    emailInput.disabled = false;
                    passwordInput.disabled = false;

                    if (!registering) {
                        submitButton.textContent = "Sign In";
                    } else {
                        submitButton.textContent = "Create Account";
                    }
                }
            });
        })();
    </script>
</body>
</html>
